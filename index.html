<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TEMAN BELAJAR — Belajar Memahami, Memahami untuk Bersama</title>
  <meta name="description" content="Media interaktif inklusif untuk memahami disabilitas.">
  <meta name="theme-color" content="#3B82F6">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/img/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Lexend:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#app" class="skip-link" id="skip-link">Lewati ke konten utama</a>

  <header class="navbar" role="banner">
    <div class="container navbar__inner">
      <a href="#/" class="brand" aria-label="TEMAN BELAJAR, ke beranda">
        <img src="assets/img/logo.png" alt="Teman Belajar Logo" class="site-logo" width="48" height="48">
      </a>

      <button class="icon-btn navbar__toggle" id="nav-toggle" aria-label="Buka menu" aria-expanded="false" aria-controls="nav-menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>

      <nav id="nav-menu" class="navbar__menu" aria-label="Navigasi utama"></nav>
    </div>
  </header>

  <!-- Panel aksesibilitas -->
  <div class="a11y-bar" role="region" aria-label="Pengaturan aksesibilitas">
    <div class="container a11y-bar__inner">
      <button class="btn btn--sm btn--ghost" id="btn-contrast" aria-pressed="false" aria-label="Aktifkan kontras tinggi">
        <i class="fa-solid fa-circle-half-stroke" aria-hidden="true"></i> Kontras
      </button>
      <button class="btn btn--sm btn--ghost" id="btn-mono" aria-pressed="false" aria-label="Aktifkan mode buta warna (monokrom)">
        <i class="fa-solid fa-eye-low-vision" aria-hidden="true"></i> Monokrom
      </button>
      <button class="btn btn--sm btn--ghost" id="btn-dyslexia" aria-pressed="false" aria-label="Aktifkan font ramah disleksia">
        <i class="fa-solid fa-font" aria-hidden="true"></i> Disleksia
      </button>
      <button class="btn btn--sm btn--ghost" id="btn-font-down" aria-label="Perkecil teks">A−</button>
      <button class="btn btn--sm btn--ghost" id="btn-font-up" aria-label="Perbesar teks">A+</button>
      <button class="btn btn--sm btn--ghost" id="btn-tts" aria-pressed="false" aria-label="Bacakan halaman ini dengan suara">
        <i class="fa-solid fa-volume-high" aria-hidden="true"></i> <span>Bacakan</span>
      </button>
    </div>
  </div>

  <main id="app" class="container" tabindex="-1" aria-live="polite"></main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <img src="assets/img/logo.png" alt="Teman Belajar Logo" class="site-logo site-logo--footer" width="80" height="80" loading="lazy">
      <p><strong>TEMAN BELAJAR</strong> — Belajar Memahami, Memahami untuk Bersama</p>
      <p class="muted">&copy; <span id="year"></span> Media edukasi inklusif.</p>
    </div>
  </footer>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/data/modules.js"></script>
  <script src="js/views/auth.js"></script>
  <script src="js/views/landing.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/topup.js"></script>
  <script src="js/data/quizzes.js"></script>
  <script src="js/data/content.js"></script>
  <script src="js/views/kuis.js"></script>
  <script src="js/views/modul.js"></script>
  <script src="js/views/profile.js"></script>
  <noscript><p class="container">Aplikasi ini membutuhkan JavaScript. Aktifkan JavaScript di browser Anda.</p></noscript>

  <script>
    // Entry point: jalankan router pertama kali saat DOM siap.
    // Jika ada yang gagal, tampilkan pesan error (bukan halaman putih kosong).
    document.addEventListener('DOMContentLoaded', function () {
      var app = document.getElementById('app');
      try {
        if (!window.TB) {
          throw new Error('File js/app.js gagal dimuat. Pastikan Live Server dibuka dari folder "teman-belajar" (yang berisi index.html).');
        }
        TB.init();
      } catch (e) {
        console.error(e);
        app.innerHTML = '<div class="card"><h1>Gagal memuat aplikasi</h1><p></p></div>';
        app.querySelector('p').textContent = e.message;
      }
    });
  </script>
</body>
</html>
